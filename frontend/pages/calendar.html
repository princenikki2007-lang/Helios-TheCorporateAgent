<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — HELIOS Compliance Assistant</title>
  <meta name="description" content="Friendly compliance calendar tracking upcoming deadlines, tax dates, and renewal windows.">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="calendar" data-breadcrumb="Calendar">

  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Navigation"></aside>

    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="app-content">

        <!-- Page Header -->
        <div class="page-hero" style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: var(--space-4); margin-bottom: var(--space-6);">
          <div>
            <div style="font-size: var(--font-size-xs); font-weight: 600; color: var(--color-brand); margin-bottom: 4px;">
              DATES &amp; DEADLINES
            </div>
            <h1 class="page-hero-title" style="font-size: 1.75rem; margin-bottom: 4px;">
              Calendar
            </h1>
            <p class="page-hero-subtitle" style="font-size: var(--font-size-sm); color: var(--text-secondary);">
              Important dates and deadlines for your company, organized simply.
            </p>
          </div>

          <!-- View Mode Toggle -->
          <div style="display: flex; gap: var(--space-2); background: var(--bg-surface); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
            <button class="btn btn-primary btn-sm" id="cal-view-timeline-btn" onclick="setCalView('timeline')">Timeline view</button>
            <button class="btn btn-ghost btn-sm" id="cal-view-table-btn" onclick="setCalView('table')">Table view</button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="card" style="padding: var(--space-3); margin-bottom: var(--space-6);">
          <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;" id="cal-filter-btns">
            <button class="btn btn-secondary btn-sm" onclick="filterCal('All')">All dates</button>
            <button class="btn btn-ghost btn-sm" onclick="filterCal('GST')">GST &amp; Tax</button>
            <button class="btn btn-ghost btn-sm" onclick="filterCal('Direct Tax')">Income Tax &amp; TDS</button>
            <button class="btn btn-ghost btn-sm" onclick="filterCal('Labour')">Employee rules</button>
            <button class="btn btn-ghost btn-sm" onclick="filterCal('License Renewal')">License renewals</button>
          </div>
        </div>

        <!-- Timeline View -->
        <div id="timeline-view-container" style="display: flex; flex-direction: column; gap: var(--space-4);">
          <!-- Populated by JS -->
        </div>

        <!-- Table View -->
        <div id="table-view-container" class="card" style="display: none; padding: 0; overflow: hidden;">
          <table class="data-table" aria-label="Compliance Deadlines">
            <thead>
              <tr>
                <th>Date</th>
                <th>Responsibility</th>
                <th>Category</th>
                <th>Authority</th>
                <th>Status</th>
                <th>What to do</th>
              </tr>
            </thead>
            <tbody id="cal-tbody">
              <!-- Loaded by JS -->
            </tbody>
          </table>
        </div>

        <!-- Trust Disclaimer -->
        <div class="legal-disclaimer-box" style="margin-top: var(--space-8);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          <span>
            HELIOS helps you understand company compliance. For important legal or tax decisions, verify with a qualified professional.
          </span>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/ui.js"></script>
  <script>
    let allEvents = [];
    let currentFilter = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      HeliosUI.init();
      loadCalendarEvents();
    });

    async function loadCalendarEvents() {
      try {
        const res = await fetch('/api/calendar');
        const data = await res.json();
        if (data.success && data.events) {
          allEvents = data.events;
          renderCalendar();
        }
      } catch (e) {
        console.error("Error loading calendar events:", e);
      }
    }

    function setCalView(view) {
      if (view === 'timeline') {
        document.getElementById('timeline-view-container').style.display = 'flex';
        document.getElementById('table-view-container').style.display = 'none';
        document.getElementById('cal-view-timeline-btn').className = 'btn btn-primary btn-sm';
        document.getElementById('cal-view-table-btn').className = 'btn btn-ghost btn-sm';
      } else {
        document.getElementById('timeline-view-container').style.display = 'none';
        document.getElementById('table-view-container').style.display = 'block';
        document.getElementById('cal-view-timeline-btn').className = 'btn btn-ghost btn-sm';
        document.getElementById('cal-view-table-btn').className = 'btn btn-primary btn-sm';
      }
    }

    function filterCal(cat) {
      currentFilter = cat;
      const btns = document.querySelectorAll('#cal-filter-btns button');
      btns.forEach(b => {
        b.className = b.textContent.includes(cat) || (cat === 'All' && b.textContent.includes('All')) ? 'btn btn-secondary btn-sm' : 'btn btn-ghost btn-sm';
      });
      renderCalendar();
    }

    function renderCalendar() {
      const filtered = allEvents.filter(e => currentFilter === 'All' || e.category.toLowerCase().includes(currentFilter.toLowerCase()));

      const timelineCont = document.getElementById('timeline-view-container');
      timelineCont.innerHTML = filtered.map(ev => {
        const isCritical = ev.severity === 'Critical';
        return `
          <div class="card" style="border-left: 4px solid ${isCritical ? 'var(--color-danger)' : 'var(--color-brand)'}; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap;">
            <div style="display: flex; gap: var(--space-4); align-items: flex-start;">
              <div style="padding: var(--space-2) var(--space-3); background-color: var(--bg-surface-secondary); border-radius: var(--radius-sm); text-align: center; min-width: 90px;">
                <div style="font-size: var(--font-size-xs); font-weight: 700; color: var(--color-brand);">${ev.date}</div>
                <div style="font-size: 0.65rem; color: var(--text-muted);">${isCritical ? 'Due soon' : 'Upcoming'}</div>
              </div>

              <div>
                <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: 2px;">
                  <span class="badge ${isCritical ? 'badge-danger' : 'badge-brand'}">${isCritical ? 'Needs attention' : 'Standard'}</span>
                  <span class="badge badge-secondary">${ev.category}</span>
                  <span style="font-size: 0.7rem; color: var(--text-muted);">${ev.authority}</span>
                </div>
                <h3 style="font-size: var(--font-size-sm); font-weight: 700; color: var(--text-primary); margin-top: 2px;">${ev.title}</h3>
                <p style="font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px;">${ev.action}</p>
              </div>
            </div>

            <div>
              <a href="policy-chat.html" class="btn btn-secondary btn-sm">Ask HELIOS →</a>
            </div>
          </div>
        `;
      }).join('');

      const tbody = document.getElementById('cal-tbody');
      tbody.innerHTML = filtered.map(ev => `
        <tr>
          <td style="font-weight: 700; color: var(--color-brand);">${ev.date}</td>
          <td style="font-weight: 600; color: var(--text-primary);">${ev.title}</td>
          <td><span class="badge badge-secondary">${ev.category}</span></td>
          <td style="font-size: 0.75rem;">${ev.authority}</td>
          <td><span class="badge ${ev.severity === 'Critical' ? 'badge-danger' : 'badge-brand'}">${ev.severity === 'Critical' ? 'Needs attention' : 'Upcoming'}</span></td>
          <td style="font-size: 0.75rem; color: var(--text-secondary);">${ev.action}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
