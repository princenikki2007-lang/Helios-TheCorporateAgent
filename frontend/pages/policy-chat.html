<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Helios — HELIOS Policy Assistant</title>
  <meta name="description" content="Ask Helios — get clear answers from your company's approved policies and documents.">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    .app-content { padding: var(--space-6); display: flex; flex-direction: column; }
    .chat-message { display: flex; gap: var(--space-3); max-width: 820px; }
    .chat-message.user { flex-direction: row-reverse; margin-left: auto; }
    .chat-message.user .msg-bubble { background: var(--color-primary); color: #fff; border-radius: var(--radius-lg) var(--radius-sm) var(--radius-lg) var(--radius-lg); }
    .chat-message.ai .msg-bubble { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm) var(--radius-lg) var(--radius-lg) var(--radius-lg); }
    .msg-bubble { padding: var(--space-4); font-size: var(--font-size-sm); line-height: var(--line-height-relaxed); box-shadow: var(--shadow-xs); }
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .msg-avatar.ai-avatar { background: linear-gradient(135deg, var(--color-brand-light), var(--color-brand)); color: #fff; }
    .msg-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: var(--space-1); }
    .chat-message.user .msg-meta { text-align: right; }
    .source-card { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--bg-surface-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); margin-top: var(--space-2); }
    .source-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--color-brand-subtle); color: var(--color-brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .typing-indicator { display: flex; align-items: center; gap: 5px; padding: var(--space-3) var(--space-4); }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: typingBounce 1.2s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    .chat-input-form { display: flex; gap: var(--space-3); align-items: flex-end; }
    .chat-textarea { flex: 1; resize: none; border-radius: var(--radius-md); border: 1px solid var(--border-light); padding: 0.625rem 0.875rem; font-family: inherit; font-size: var(--font-size-sm); line-height: 1.5; min-height: 48px; max-height: 140px; transition: border-color 150ms; }
    .chat-textarea:focus { border-color: var(--color-brand); box-shadow: 0 0 0 3px var(--color-brand-glow); }
    .empty-chat-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; padding: var(--space-12); }
  </style>
</head>
<body data-page-title="Ask Helios" data-breadcrumb="Ask Helios">

  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Sidebar"></aside>

    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="app-content">
        <div class="chat-container" style="height: calc(100vh - var(--header-height) - var(--space-6) * 2);">

          <!-- Chat Header Bar -->
          <div class="chat-header-bar">
            <div>
              <div style="font-size: var(--font-size-base); font-weight: 700; color: var(--text-primary);">Ask Helios</div>
              <div style="font-size: var(--font-size-xs); color: var(--text-muted);">Get clear answers from your company's approved policies and documents.</div>
            </div>
            <div style="display: flex; gap: var(--space-2);">
              <button type="button" class="btn btn-secondary btn-sm" id="btn-new-chat" onclick="startNewChat()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Chat
              </button>
            </div>
          </div>

          <!-- Messages Area -->
          <div class="chat-messages-area" id="chat-messages-area">
            <!-- Empty state shown initially; replaced by messages on submit -->
            <div class="empty-chat-state" id="chat-empty-state">
              <div class="brand-icon-wrapper" style="width: 56px; height: 56px; margin-bottom: var(--space-4);">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 32px; height: 32px;">
                  <circle cx="12" cy="12" r="4.5" fill="currentColor" fill-opacity="0.95"/>
                  <path d="M12 2V5M12 19V22M2 12H5M19 12H22M4.93 4.93L7.05 7.05M16.95 16.95L19.07 19.07M4.93 19.07L7.05 16.95M16.95 7.05L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <h3 style="font-size: var(--font-size-lg); font-weight: 700; color: var(--text-primary); margin-bottom: var(--space-2);">What can Helios help you with today?</h3>
              <p style="font-size: var(--font-size-sm); color: var(--text-secondary); max-width: 440px; margin-bottom: var(--space-6);">Ask a question about your company's policies, benefits, work rules, or approved documents.</p>
              <div style="display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; max-width: 560px;">
                <button class="btn btn-secondary btn-sm" onclick="insertSuggestedQ('How many leaves can I carry forward?')">How many leaves can I carry forward?</button>
                <button class="btn btn-secondary btn-sm" onclick="insertSuggestedQ('What is the work-from-home policy?')">What is the WFH policy?</button>
                <button class="btn btn-secondary btn-sm" onclick="insertSuggestedQ('What benefits am I eligible for?')">What benefits am I eligible for?</button>
                <button class="btn btn-secondary btn-sm" onclick="insertSuggestedQ('What are the probation rules?')">What are the probation rules?</button>
              </div>
            </div>
          </div>

          <!-- Input Area -->
          <div class="chat-input-wrapper">
            <form class="chat-input-form" id="chat-input-form" onsubmit="handleChatSubmit(event)">
              <textarea
                id="chat-question-input"
                class="chat-textarea"
                placeholder="Ask Helios anything about leave, benefits, work policies, or company rules..."
                rows="1"
                aria-label="Ask Helios a question"
              ></textarea>
              <button type="submit" class="btn btn-primary" id="btn-chat-send" style="padding: 0.625rem 1rem; height: 48px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </form>
            <div style="font-size: 0.65rem; color: var(--text-muted); margin-top: var(--space-2); text-align: center;">Helios answers are based solely on your company's approved policy documents.</div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../mock/users.js"></script>
  <script src="../mock/conversations.js"></script>
  <script src="../mock/documents.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/policy.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const MOCK_RESPONSES = [
      {
        question_keywords: ['leave', 'carry', 'earned'],
        answer: "According to the company's <strong>Leave Policy</strong>, employees can carry forward up to <strong>10 earned leaves</strong> per calendar year. Any earned leave above this limit will lapse at year-end unless you apply for an encashment request through HR.",
        sources: [{ document_name: "Leave Policy.pdf", section: "4.2", page_number: 7 }]
      },
      {
        question_keywords: ['wfh', 'work from home', 'remote', 'hybrid'],
        answer: "Under the <strong>Hybrid Work & Remote Office Guidelines</strong>, employees are eligible for up to <strong>3 remote work days per week</strong>, subject to manager approval. A minimum of 2 days per week must be spent at the office unless on approved full-remote status.",
        sources: [{ document_name: "Hybrid_Work_Guidelines.docx", section: "2.1", page_number: 3 }]
      },
      {
        question_keywords: ['benefit', 'eligible', 'insurance', 'health'],
        answer: "Full-time employees are eligible for a <strong>comprehensive health benefits package</strong> that includes medical, dental, and vision coverage. Coverage begins on your first day of employment. Dependents can be added during open enrollment or within 30 days of a qualifying life event.",
        sources: [{ document_name: "Health_Benefits_Summary_2026.pdf", section: "1.0", page_number: 2 }]
      },
      {
        question_keywords: ['probation', 'probationary'],
        answer: "The standard <strong>probation period is 90 days</strong> from the date of joining. A formal mid-point review is conducted at the 60-day mark. Successful completion of probation is confirmed in writing by your HR Business Partner.",
        sources: [{ document_name: "Employee_Handbook_v2026.pdf", section: "3.4", page_number: 19 }]
      }
    ];

    function getFallbackResponse() {
      return {
        answer: "I found relevant information in your company's approved policy documents. For the most accurate and complete answer, please consult the HR team or refer to the specific policy document directly. Helios is always learning from your latest approved documents.",
        sources: [{ document_name: "Employee_Handbook_v2026.pdf", section: "General", page_number: 1 }]
      };
    }

    function getMockResponse(question) {
      const lower = question.toLowerCase();
      for (const r of MOCK_RESPONSES) {
        if (r.question_keywords.some(k => lower.includes(k))) return r;
      }
      return getFallbackResponse();
    }

    function formatTime(date) {
      return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function renderSourceCard(source) {
      return `
        <div class="source-card">
          <div class="source-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          </div>
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: var(--font-size-xs); font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${source.document_name}</div>
            <div style="font-size: 0.7rem; color: var(--text-muted);">Section ${source.section} &middot; Page ${source.page_number}</div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" style="font-size: 0.7rem; white-space: nowrap;">View Source →</button>
        </div>
      `;
    }

    function appendUserMessage(text) {
      const user = HeliosAuth.getCurrentUser();
      hideEmptyState();
      const area = document.getElementById('chat-messages-area');
      const div = document.createElement('div');
      div.className = 'chat-message user';
      div.innerHTML = `
        <div>
          <div class="msg-bubble">${escapeHtml(text)}</div>
          <div class="msg-meta">${formatTime(new Date())}</div>
        </div>
        <div class="msg-avatar" style="background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: #fff;">${user ? user.avatar : 'U'}</div>
      `;
      area.appendChild(div);
      scrollToBottom();
    }

    function showTypingIndicator() {
      hideEmptyState();
      const area = document.getElementById('chat-messages-area');
      const div = document.createElement('div');
      div.className = 'chat-message ai';
      div.id = 'typing-indicator-msg';
      div.innerHTML = `
        <div class="msg-avatar ai-avatar">H</div>
        <div class="msg-bubble" style="padding: var(--space-2) var(--space-4);">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      area.appendChild(div);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-indicator-msg');
      if (el) el.remove();
    }

    function appendAIMessage(data) {
      const area = document.getElementById('chat-messages-area');
      const div = document.createElement('div');
      div.className = 'chat-message ai';
      const sourcesHTML = (data.sources || []).map(renderSourceCard).join('');
      div.innerHTML = `
        <div class="msg-avatar ai-avatar">H</div>
        <div style="flex: 1; min-width: 0; max-width: 720px;">
          <div class="msg-bubble">${data.answer}</div>
          ${sourcesHTML ? `<div style="margin-top: var(--space-2);">
            <div style="font-size: 0.7rem; font-weight: 600; color: var(--text-muted); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: 0.05em;">Sources</div>
            ${sourcesHTML}
          </div>` : ''}
          <div class="msg-meta">${formatTime(new Date())} · Helios</div>
        </div>
      `;
      area.appendChild(div);
      scrollToBottom();
    }

    function hideEmptyState() {
      const empty = document.getElementById('chat-empty-state');
      if (empty) empty.style.display = 'none';
    }

    function scrollToBottom() {
      const area = document.getElementById('chat-messages-area');
      area.scrollTop = area.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function insertSuggestedQ(text) {
      const input = document.getElementById('chat-question-input');
      if (input) { input.value = text; input.focus(); }
    }

    function startNewChat() {
      const area = document.getElementById('chat-messages-area');
      area.innerHTML = '';
      // Restore empty state
      const emptyState = document.createElement('div');
      emptyState.id = 'chat-empty-state';
      emptyState.className = 'empty-chat-state';
      emptyState.innerHTML = `
        <div class="brand-icon-wrapper" style="width: 56px; height: 56px; margin-bottom: var(--space-4);">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 32px; height: 32px;">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" fill-opacity="0.95"/>
            <path d="M12 2V5M12 19V22M2 12H5M19 12H22M4.93 4.93L7.05 7.05M16.95 16.95L19.07 19.07M4.93 19.07L7.05 16.95M16.95 7.05L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h3 style="font-size: var(--font-size-lg); font-weight: 700; color: var(--text-primary); margin-bottom: var(--space-2);">What can Helios help you with today?</h3>
        <p style="font-size: var(--font-size-sm); color: var(--text-secondary); max-width: 440px; margin-bottom: var(--space-6);">Ask a question about your company's policies, benefits, work rules, or approved documents.</p>
        <div style="display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; max-width: 560px;">
          <button class="btn btn-secondary btn-sm" onclick="insertSuggestedQ('How many leaves can I carry forward?')">How many leaves can I carry forward?</button>
          <button class="btn btn-secondary btn-sm" onclick="insertSuggestedQ('What is the work-from-home policy?')">What is the WFH policy?</button>
          <button class="btn btn-secondary btn-sm" onclick="insertSuggestedQ('What benefits am I eligible for?')">What benefits am I eligible for?</button>
          <button class="btn btn-secondary btn-sm" onclick="insertSuggestedQ('What are the probation rules?')">What are the probation rules?</button>
        </div>
      `;
      area.appendChild(emptyState);
      document.getElementById('chat-question-input').value = '';
    }

    async function handleChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chat-question-input');
      const question = input.value.trim();
      if (!question) return;

      input.value = '';
      input.style.height = 'auto';
      document.getElementById('btn-chat-send').disabled = true;

      appendUserMessage(question);
      showTypingIndicator();

      // Simulate AI response delay
      await new Promise(r => setTimeout(r, 1400 + Math.random() * 600));

      removeTypingIndicator();
      const response = getMockResponse(question);
      appendAIMessage(response);
      document.getElementById('btn-chat-send').disabled = false;
    }

    // Auto-resize textarea
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('chat-question-input');
      if (textarea) {
        textarea.addEventListener('input', () => {
          textarea.style.height = 'auto';
          textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
        });
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.getElementById('chat-input-form').requestSubmit();
          }
        });
      }

      // Check for ?q= query param from dashboard
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q');
      if (q) {
        const input = document.getElementById('chat-question-input');
        if (input) {
          input.value = q;
          setTimeout(() => {
            document.getElementById('chat-input-form').requestSubmit();
          }, 400);
        }
      }
    });
  </script>
</body>
</html>
