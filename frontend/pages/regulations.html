<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's New — HELIOS Compliance Assistant</title>
  <meta name="description" content="Recent legal and tax rule changes explained in plain English for your company.">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="regulations" data-breadcrumb="What's New">

  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Navigation"></aside>

    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="app-content">

        <!-- Page Header -->
        <div class="page-hero" style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: var(--space-4); margin-bottom: var(--space-6);">
          <div>
            <div style="font-size: var(--font-size-xs); font-weight: 600; color: var(--color-brand); margin-bottom: 4px;">
              RULE CHANGES
            </div>
            <h1 class="page-hero-title" style="font-size: 1.75rem; margin-bottom: 4px;">
              What's new?
            </h1>
            <p class="page-hero-subtitle" style="font-size: var(--font-size-sm); color: var(--text-secondary);">
              Recent legal and tax changes, explained in simple terms so you know what matters.
            </p>
          </div>

          <!-- View Mode Toggle -->
          <div style="display: flex; gap: var(--space-2); background: var(--bg-surface); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
            <button class="btn btn-primary btn-sm" id="tab-btn-cards" onclick="switchView('cards')">Simple overview</button>
            <button class="btn btn-ghost btn-sm" id="tab-btn-diff" onclick="switchView('diff')">Compare changes</button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="card" style="padding: var(--space-3); margin-bottom: var(--space-6);">
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3);">
            <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;" id="auth-filter-btns">
              <button class="btn btn-secondary btn-sm" onclick="filterAuth('All')">All topics</button>
              <button class="btn btn-ghost btn-sm" onclick="filterAuth('CBIC')">GST &amp; Tax</button>
              <button class="btn btn-ghost btn-sm" onclick="filterAuth('MeitY')">Data &amp; Privacy</button>
              <button class="btn btn-ghost btn-sm" onclick="filterAuth('Labour')">Employee rules</button>
              <button class="btn btn-ghost btn-sm" onclick="filterAuth('MCA')">Company filings</button>
            </div>

            <div style="font-size: var(--font-size-xs); color: var(--text-muted);">
              Grounded with verified official notices
            </div>
          </div>
        </div>

        <!-- VIEW 1: 3-QUESTION RULE CARDS -->
        <div id="view-cards">
          <div id="rules-cards-container" style="display: flex; flex-direction: column; gap: var(--space-5);">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- VIEW 2: COMPARE CHANGES (DIFF) -->
        <div id="view-diff" style="display: none;">
          <div id="rules-diff-container" style="display: flex; flex-direction: column; gap: var(--space-5);">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- TRUST NOTICE -->
        <div class="legal-disclaimer-box" style="margin-top: var(--space-8);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          <span>
            HELIOS helps you understand company compliance. For important legal or tax decisions, verify with a qualified professional.
          </span>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/ui.js"></script>
  <script>
    let allRegulations = [];
    let allDiffs = [];
    let currentAuth = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      HeliosUI.init();
      loadData();
    });

    function switchView(mode) {
      if (mode === 'cards') {
        document.getElementById('view-cards').style.display = 'block';
        document.getElementById('view-diff').style.display = 'none';
        document.getElementById('tab-btn-cards').className = 'btn btn-primary btn-sm';
        document.getElementById('tab-btn-diff').className = 'btn btn-ghost btn-sm';
      } else {
        document.getElementById('view-cards').style.display = 'none';
        document.getElementById('view-diff').style.display = 'block';
        document.getElementById('tab-btn-cards').className = 'btn btn-ghost btn-sm';
        document.getElementById('tab-btn-diff').className = 'btn btn-primary btn-sm';
      }
    }

    async function loadData() {
      try {
        const [regRes, diffRes] = await Promise.all([
          fetch('/api/regulations'),
          fetch('/api/regulations/diff')
        ]);
        const regData = await regRes.json();
        const diffData = await diffRes.json();

        if (regData.success) {
          allRegulations = regData.regulations;
          renderCards();
        }
        if (diffData.success) {
          allDiffs = diffData.ruleChanges;
          renderDiffs();
        }
      } catch (e) {
        console.error("Error loading rule data:", e);
      }
    }

    function filterAuth(auth) {
      currentAuth = auth;
      const btns = document.querySelectorAll('#auth-filter-btns button');
      btns.forEach(b => {
        b.className = b.textContent.includes(auth) || (auth === 'All' && b.textContent.includes('All')) ? 'btn btn-secondary btn-sm' : 'btn btn-ghost btn-sm';
      });
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('rules-cards-container');
      const filtered = allRegulations.filter(r => currentAuth === 'All' || r.authority.toLowerCase().includes(currentAuth.toLowerCase()));

      container.innerHTML = filtered.map(r => `
        <div class="rule-3q-card">
          <div class="rule-3q-header">
            <div>
              <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: 4px;">
                <span class="badge ${r.impactLevel === 'HIGH' ? 'badge-danger' : r.impactLevel === 'MEDIUM' ? 'badge-warning' : 'badge-info'}">
                  ${r.impactLevel === 'HIGH' ? 'High Impact' : r.impactLevel === 'MEDIUM' ? 'Medium Impact' : 'Low Impact'}
                </span>
                <span class="badge badge-success">Effective ${r.effectiveDate}</span>
                <span style="font-size: 0.7rem; color: var(--text-muted);">${r.authority}</span>
              </div>
              <div class="rule-3q-title">${r.title}</div>
              <div class="rule-3q-meta">Published: ${r.publicationDate} · Where this rule applies: ${r.jurisdiction}</div>
            </div>
          </div>

          <!-- Question 1: What is happening? -->
          <div class="rule-3q-block">
            <div class="rule-3q-label">1. What is happening?</div>
            <div class="rule-3q-text">${r.summary}</div>
          </div>

          <!-- Question 2: Why should you care? -->
          <div class="rule-3q-block">
            <div class="rule-3q-label">2. Why should you care?</div>
            <div class="rule-3q-text">
              Because your company operates in ${r.jurisdiction} and this rule is issued by ${r.authority}, this change may be directly relevant to your daily operations.
            </div>
          </div>

          <!-- Question 3: What should you do? -->
          <div class="rule-3q-block" style="background: var(--color-brand-subtle); border-left: 3px solid var(--color-brand);">
            <div class="rule-3q-label" style="color: var(--color-brand);">3. What should you do?</div>
            <div class="rule-3q-text" style="font-weight: 500;">
              ${r.keyRequirements ? r.keyRequirements[0] : 'Review your procedures and confirm your team is updated.'}
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-4); border-top: 1px solid var(--border-subtle); padding-top: var(--space-3);">
            <span style="font-size: 0.7rem; color: var(--text-muted);">
              Ref: ${r.gazetteId}
            </span>
            <div style="display: flex; gap: var(--space-2);">
              <a href="policy-chat.html" class="btn btn-primary btn-sm">Ask HELIOS about this</a>
              <a href="${r.officialSourceLink}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Official notice ↗</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderDiffs() {
      const container = document.getElementById('rules-diff-container');
      container.innerHTML = allDiffs.map(d => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3); flex-wrap: wrap; gap: var(--space-2);">
            <div>
              <div style="display: flex; align-items: center; gap: var(--space-2);">
                <span class="badge ${d.changeType === 'NEW' ? 'badge-success' : 'badge-warning'}">${d.changeType === 'NEW' ? 'New rule' : 'Rule updated'}</span>
                <span class="badge badge-brand">${d.statusBadge}</span>
              </div>
              <h3 style="font-size: var(--font-size-md); font-weight: 700; color: var(--text-primary); margin-top: var(--space-2);">
                ${d.title}
              </h3>
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">
                ${d.authority} · Effective: ${d.effectiveDate}
              </div>
            </div>
          </div>

          <div class="compare-container" style="margin-bottom: var(--space-4);">
            <div style="padding: var(--space-4); background-color: var(--bg-surface-secondary); border-radius: var(--radius-sm); border-left: 3px solid var(--border-strong);">
              <div style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;">
                PREVIOUS RULE
              </div>
              <div style="font-size: var(--font-size-xs); color: var(--text-secondary); line-height: 1.5;">
                ${d.oldRequirement}
              </div>
            </div>

            <div style="padding: var(--space-4); background-color: var(--color-success-subtle); border-radius: var(--radius-sm); border-left: 3px solid var(--color-success);">
              <div style="font-size: 0.65rem; font-weight: 700; color: var(--color-success-text); text-transform: uppercase; margin-bottom: 4px;">
                NEW RULE (WHAT APPLIES NOW)
              </div>
              <div style="font-size: var(--font-size-xs); color: var(--text-primary); line-height: 1.5; font-weight: 500;">
                ${d.newRequirement}
              </div>
            </div>
          </div>

          <div style="padding: var(--space-3); background-color: var(--bg-surface-secondary); border-radius: var(--radius-xs);">
            <div style="font-size: 0.65rem; font-weight: 700; color: var(--color-brand); text-transform: uppercase; margin-bottom: 2px;">
              HOW THIS CHANGE MAY AFFECT YOU:
            </div>
            <div style="font-size: var(--font-size-xs); color: var(--text-primary); line-height: 1.5;">
              ${d.heliosImpactAssessment}
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
