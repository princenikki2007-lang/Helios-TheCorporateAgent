<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Repository — HELIOS</title>
  <meta name="description" content="Manage company policy documents in the HELIOS document repository.">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    .doc-table { width: 100%; border-collapse: collapse; }
    .doc-table thead th { background-color: var(--bg-surface-secondary); padding: 0.625rem var(--space-4); text-align: left; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); white-space: nowrap; }
    .doc-table tbody tr { border-bottom: 1px solid var(--border-subtle); transition: background-color 150ms; }
    .doc-table tbody tr:hover { background-color: var(--bg-surface-secondary); }
    .doc-table tbody td { padding: var(--space-4); font-size: var(--font-size-xs); color: var(--text-secondary); vertical-align: middle; }
    .doc-table tbody td:first-child { color: var(--text-primary); font-weight: 500; }
  </style>
</head>
<body data-page-title="Document Repository" data-breadcrumb="Documents" data-required-roles="hr_manager,company_admin">

  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Sidebar"></aside>

    <div class="app-main">
      <header class="app-header" id="app-header"></header>

      <main class="app-content">
        <!-- Access Gate — shown if user is employee -->
        <div id="access-denied-msg" style="display: none; text-align: center; padding: var(--space-16);">
          <div style="font-size: 3rem; margin-bottom: var(--space-4);">🔒</div>
          <h2 style="font-size: var(--font-size-xl); font-weight: 700; color: var(--text-primary); margin-bottom: var(--space-2);">Access Restricted</h2>
          <p style="color: var(--text-secondary); margin-bottom: var(--space-6);">The Document Repository is only available to HR Managers and Company Admins.</p>
          <a href="dashboard.html" class="btn btn-primary">Return to Dashboard</a>
        </div>

        <!-- Documents Content — HR/Admin only -->
        <div id="documents-content" style="display: none;">
          <div class="page-hero" style="display: flex; align-items: flex-end; justify-content: space-between;">
            <div>
              <h2 class="page-hero-title">Document Repository</h2>
              <p class="page-hero-subtitle">Manage, upload, and monitor policy documents indexed by Helios.</p>
            </div>
            <a href="upload-document.html" class="btn btn-primary" id="btn-upload-document">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path></svg>
              Upload Document
            </a>
          </div>

          <!-- Filters -->
          <div class="card" style="padding: var(--space-4); margin-bottom: var(--space-6);">
            <div style="display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center;">
              <div style="position: relative; flex: 1; min-width: 200px;">
                <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <input type="text" id="doc-search" class="form-input" placeholder="Search documents..." style="padding-left: 2.25rem;" oninput="filterDocuments()" />
              </div>
              <select id="doc-filter-type" class="form-select" style="width: auto;" onchange="filterDocuments()">
                <option value="">All Types</option>
                <option>General Policy</option>
                <option>Benefits &amp; Time Off</option>
                <option>Workplace</option>
                <option>Benefits &amp; Insurance</option>
              </select>
              <select id="doc-filter-status" class="form-select" style="width: auto;" onchange="filterDocuments()">
                <option value="">All Statuses</option>
                <option>Active</option>
                <option>Processing</option>
                <option>Failed</option>
                <option>Archived</option>
              </select>
            </div>
          </div>

          <!-- Documents Table -->
          <div class="card" style="padding: 0; overflow: hidden;">
            <table class="doc-table" aria-label="Policy Documents">
              <thead>
                <tr>
                  <th>Document</th>
                  <th>Type</th>
                  <th>Version</th>
                  <th>Status</th>
                  <th>Processing</th>
                  <th>Updated</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="docs-table-body">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../mock/users.js"></script>
  <script src="../mock/conversations.js"></script>
  <script src="../mock/documents.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/documents.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const STATUS_BADGE_MAP = {
      'Active': 'badge-success',
      'Processing': 'badge-warning',
      'Failed': 'badge-danger',
      'Archived': 'badge-neutral'
    };

    function getStatusBadge(status) {
      const cls = STATUS_BADGE_MAP[status] || 'badge-neutral';
      return `<span class="badge ${cls}">${status}</span>`;
    }

    function renderDocsTable(docs) {
      const tbody = document.getElementById('docs-table-body');
      if (!docs.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: var(--space-8); color: var(--text-muted);">No documents found.</td></tr>`;
        return;
      }
      tbody.innerHTML = docs.map(d => `
        <tr id="doc-row-${d.id}">
          <td>
            <div style="display: flex; align-items: center; gap: var(--space-3);">
              <div style="width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--color-brand-subtle); color: var(--color-brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.65rem; font-weight: 700;">${d.filename.split('.').pop().toUpperCase()}</div>
              <div>
                <div style="font-weight: 600; color: var(--text-primary);">${d.title}</div>
                <div style="font-size: 0.65rem; color: var(--text-muted);">${d.filename} &middot; ${d.size}</div>
              </div>
            </div>
          </td>
          <td>${d.category}</td>
          <td><span class="badge badge-neutral">${d.version}</span></td>
          <td>${getStatusBadge(d.status)}</td>
          <td style="color: ${d.processing_status === 'Indexed' ? 'var(--color-success)' : 'var(--color-warning)'}; font-weight: 500;">${d.processing_status}</td>
          <td>${d.updated_at}</td>
          <td style="text-align: right;">
            <div style="display: flex; gap: var(--space-2); justify-content: flex-end;">
              <button type="button" class="btn btn-secondary btn-sm">View</button>
              <button type="button" class="btn btn-ghost btn-sm" style="color: var(--color-danger);" onclick="archiveDocument('${d.id}')">Archive</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterDocuments() {
      const search = document.getElementById('doc-search').value.toLowerCase();
      const typeFilter = document.getElementById('doc-filter-type').value;
      const statusFilter = document.getElementById('doc-filter-status').value;
      const docs = (window.HELIOS_MOCK_DOCUMENTS || []).filter(d => {
        const matchSearch = !search || d.title.toLowerCase().includes(search) || d.filename.toLowerCase().includes(search);
        const matchType = !typeFilter || d.category === typeFilter;
        const matchStatus = !statusFilter || d.status === statusFilter;
        return matchSearch && matchType && matchStatus;
      });
      renderDocsTable(docs);
    }

    function archiveDocument(id) {
      const docs = window.HELIOS_MOCK_DOCUMENTS || [];
      const doc = docs.find(d => d.id === id);
      if (doc) { doc.status = 'Archived'; filterDocuments(); }
      HeliosUI.showToast('Document archived.', 'info');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const canAccess = HeliosAuth.canManageDocuments();
      document.getElementById('access-denied-msg').style.display = canAccess ? 'none' : 'block';
      document.getElementById('documents-content').style.display = canAccess ? 'block' : 'none';
      if (canAccess) renderDocsTable(window.HELIOS_MOCK_DOCUMENTS || []);
    });
  </script>
</body>
</html>
